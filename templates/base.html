<!DOCTYPE html>
<!--
    base.html
    This is a "layout" template. Other pages (index.html, new_asado.html,
    view_asado.html) will EXTEND this file (using Jinja's "extends" tag)
    and only fill in the content block. This avoids repeating
    the head section, navigation bar, and CSS link on every single page.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag is what makes the page responsive on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asados App</title>
    <!-- Google Fonts: EB Garamond (headings — a classic, restrained
         serif in the Garamond tradition, chosen after studying "The
         Designer's Dictionary of Color" for its own heading/body
         typeface: a moderate-contrast transitional serif, not a
         quirky display font) + Inter (body/UI text — clean and
         highly legible, still needed for forms/tables at small
         sizes). Loaded from Google's CDN like Leaflet already is
         elsewhere in this app, so it just needs the visitor's own
         internet connection. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="nav-title">🔥 Asados</a>
        <!-- g.username is set on every request by load_logged_in_user()
             in app.py — None if nobody is logged in. Jinja templates can
             read Flask's "g" object directly, no need to pass it manually
             from every single route. -->
        {% if g.username %}
            <div class="navbar-right">
                <a href="{{ url_for('new_asado') }}" class="nav-link">Añadir Asado</a>
                <a href="{{ url_for('base_asados') }}" class="nav-link">📋 Base de Asados</a>
                <a href="{{ url_for('activity_log_page') }}" class="nav-link">🕓 Actividad</a>
                <a href="{{ url_for('locations_page') }}" class="nav-link">📍 Ubicaciones</a>
                <a href="{{ url_for('config_page') }}" class="nav-link">⚙️ Config</a>
                <span class="nav-username">👤 {{ g.name }}</span>
                <a href="{{ url_for('logout') }}" class="nav-link">Salir</a>
            </div>
        {% endif %}
    </nav>

    <main class="container">
        <!-- This is a placeholder block. Child templates
             insert their own HTML content here. -->
        {% block content %}{% endblock %}
    </main>

    <!-- Small, unobtrusive version tracker + a personal dedication —
         "version" is injected by app.py's inject_version() context
         processor, same pattern csrf_token() already uses. -->
    <footer class="app-footer">
        <span class="app-version">v{{ version }}</span>
        <span class="app-footer-quote">"Soñás la hoguera donde siempre sos la leña" (Indio, 1949-2026)</span>
    </footer>
</body>
</html>
