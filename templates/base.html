<!DOCTYPE html>
<!--
    base.html
    This is a "layout" template. Other pages (index.html, new_asado.html,
    view_asado.html) will EXTEND this file (using Jinja's "extends" tag)
    and only fill in the content block. This avoids repeating
    the head section, navigation bar, and CSS link on every single page.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- This meta tag is what makes the page responsive on phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asados App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="nav-title">🔥 Asados</a>
        <!-- g.username is set on every request by load_logged_in_user()
             in app.py — None if nobody is logged in. Jinja templates can
             read Flask's "g" object directly, no need to pass it manually
             from every single route. -->
        {% if g.username %}
            <div class="navbar-right">
                <a href="{{ url_for('new_asado') }}" class="nav-link">Añadir Asado</a>
                <a href="{{ url_for('base_asados') }}" class="nav-link">📋 Base de Asados</a>
                <a href="{{ url_for('config_page') }}" class="nav-link">⚙️ Config</a>
                <span class="nav-username">👤 {{ g.name }}</span>
                <a href="{{ url_for('logout') }}" class="nav-link">Salir</a>
            </div>
        {% endif %}
    </nav>

    <main class="container">
        <!-- This is a placeholder block. Child templates
             insert their own HTML content here. -->
        {% block content %}{% endblock %}
    </main>
</body>
</html>
