{% extends "base.html" %}
<!--
    new_asado.html = the "create a new asado" page. The actual form
    fields + JS live in _asado_form.html (shared with view_asado.html's
    edit form) — this file just sets the "create mode" context
    (asado=None, no existing participants) that app.py's new_asado()
    route already passes in, and includes the shared partial.
-->

{% block content %}
<!-- Spanish, like every other user-facing string in this app (see
     CLAUDE.md's language convention) — this heading had been sitting
     in English since Phase 1 and was simply missed. -->
<h2>Añadir Asado</h2>
{% if error %}
    <p class="error-message">{{ error }}</p>
{% endif %}
{% include "_asado_form.html" %}
{% endblock %}
